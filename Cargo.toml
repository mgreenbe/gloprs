[package]
name = "gloprs"
description = "A Rust port of the GLOP linear-programming solver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lp_data = { package = "gloprs-lp-data", path = "lp_data" }
rand = "0.9.2"

[features]
phase8_update_row_probe = []

[lib]
name = "gloprs"

[[bin]]
name = "gloprs"
path = "src/bin/gloprs.rs"

[lints]
workspace = true

[[bench]]
name = "basis_kernels"
harness = false

[dev-dependencies]
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"

[workspace]
members = [".", "lp_data"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/mgreenbe/gloprs"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
